<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Heart Rays</title>
<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    background: black;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function heartX(t, s=16) {   // تكبير القلب
  return s * 16 * Math.pow(Math.sin(t), 3);
}
function heartY(t, s=16) {
  return -s * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
}

let rays = [];
const totalRays = 70; // عدد الخطوط
for (let i = 0; i < totalRays; i++) {
  let t = (i / totalRays) * Math.PI * 2;
  rays.push([heartX(t), heartY(t)]);
}

let step = 0;
let lastTime = 0;
const delay = 70; // سرعة الخطوط (أسرع من قبل)

function draw(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // كتابة الاسم فوق القلب
  ctx.fillStyle = "#ff2d75";
  ctx.font = "bold 48px Arial";
  ctx.textAlign = "center";
  ctx.fillText("شوشي", canvas.width/2, canvas.height/2 - 200);

  // رسم القلب
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2 + 50);
  ctx.strokeStyle = "#ff2d75";
  ctx.lineWidth = 2;

  for (let i = 0; i < step; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(rays[i][0], rays[i][1]);
    ctx.stroke();
  }

  ctx.restore();

  if (now - lastTime > delay) {
    step++;
    lastTime = now;
    if (step > rays.length) {
      step = 0; // إعادة من البداية
    }
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
